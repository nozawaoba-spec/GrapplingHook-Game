<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="鉤縄で振り子移動しながら敵を踏んで進む棒人間アクションゲーム">
<title>鍵縄ランナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
/* Layout: full-bleed canvas; sumi ink on misty dusk paper, brass hooks, madder-red foes */
:root{
  --sky-top:#c9d3dc; --sky-bot:#eef0ee; --ink:#1d2228; --ink-soft:#5b6670;
  --brass:#b8862b; --ai:#2c4a7a; --water:#7f93a6; --foe:#8e2f27;
  --display:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
html,body{height:100%;margin:0}
body{background:var(--sky-bot);color:var(--ink);font-family:var(--ui);overflow:hidden}
#wrap{position:relative;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;font-variant-numeric:tabular-nums}
#score{font-family:var(--display);font-size:clamp(28px,5vw,40px);line-height:1}
#score small{font-family:var(--ui);font-size:14px;margin-left:4px;color:var(--ink-soft)}
#sub{font-size:13px;color:var(--ink-soft);margin-top:6px;letter-spacing:.04em}
#sub b{color:var(--foe);font-weight:700}
#best{font-size:13px;letter-spacing:.08em;color:var(--ink-soft);text-align:right}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  text-align:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#panel h1{font-family:var(--display);font-weight:400;font-size:clamp(56px,13vw,120px);margin:0;line-height:1;letter-spacing:.06em}
#panel h1 span{color:var(--brass)}
#panel p{margin:0;font-size:15px;line-height:1.75;color:var(--ink-soft);max-width:32em}
#panel .go{font-weight:700;color:var(--ai);font-size:16px;letter-spacing:.12em;padding:8px 18px;border:1.5px solid var(--ai);border-radius:2px;background:color-mix(in srgb,var(--sky-bot) 75%,transparent)}
#panel .result{font-family:var(--display);font-size:30px;color:var(--ink);line-height:1.3}
#panel .result small{display:block;font-family:var(--ui);font-size:14px;color:var(--ink-soft)}
@media (prefers-reduced-motion:no-preference){ #panel .go{animation:pulse 1.6s ease-in-out infinite} }
@keyframes pulse{50%{opacity:.45}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" aria-label="鍵縄ゲーム画面"></canvas>
  <div id="hud">
    <div><div id="score">0<small>点</small></div><div id="sub">0 m ・ 討伐 <b>0</b></div></div>
    <div id="best">最高 0 点</div>
  </div>
  <div id="panel">
    <h1>鍵<span>縄</span></h1>
    <p>地面は自動で走る。押すと跳んで、前方の鉤に縄を掛ける。離すと飛ぶ。<br>赤い敵は上から踏めば倒せる。横から当たる・矢に当たる・川に落ちると終わり。</p>
    <div class="result" id="result" hidden></div>
    <div class="go" id="go">タップ／スペースで開始</div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),subEl=document.getElementById('sub'),bestEl=document.getElementById('best'),
      panel=document.getElementById('panel'),resultEl=document.getElementById('result'),goEl=document.getElementById('go');
const H=600, WATER=560, G=1500, RANGE=360, PX_PER_M=40, RUN=270;
let W=800, scale=1, dpr=1;
let best=0; try{best=+localStorage.getItem('kaginawa-best2')||0}catch(e){}
bestEl.textContent=`最高 ${best} 点`;

function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  const r=cv.getBoundingClientRect();
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  scale=r.height/H; W=r.width/scale;
}
addEventListener('resize',resize); resize();

const rand=(a,b)=>a+Math.random()*(b-a);
let state,p,v,onGround,anchors,lastAX,islands,lastIX,foes,arrows,fx,hook,cam,held=false,trail,splash,t,kills,meters,deathMsg,dieT,spin;

function reset(){
  p={x:90,y:432}; v={x:0,y:0}; onGround=true; hook=null; cam=0; trail=[]; splash=null; t=0; kills=0; meters=0; spin=0;
  anchors=[]; lastAX=260; islands=[{x0:-400,x1:520,top:440}]; lastIX=520; foes=[]; arrows=[]; fx=[];
  fill(); state='ready';
}
function dist(){return Math.max(0,(lastIX)/PX_PER_M)}
function addIsland(){
  const d=lastIX/PX_PER_M;
  const gap=rand(150,260)+Math.min(d*.35,140);
  const len=rand(240,560)-Math.min(d*.6,120);
  const x0=lastIX+gap, x1=x0+len, top=rand(415,495);
  islands.push({x0,x1,top}); lastIX=x1;
  if(d>8 && Math.random()<Math.min(.85,.45+d/400)){
    const x=rand(x0+40,x1-40);
    foes.push({type:'walker',x,y:top,min:x0+16,max:x1-16,vx:Math.random()<.5?-55:55,ph:Math.random()*6});
  }
  if(d>30 && Math.random()<Math.min(.6,.25+d/800)){
    foes.push({type:'archer',x:x1-34,y:top,cool:rand(.5,1.8),ph:0,draw:0});
  }
}
function addAnchor(){
  const d=lastAX/PX_PER_M;
  const gap=Math.min(rand(170,260)+d*.2,340);
  if(d>20 && Math.random()<Math.min(.55,.2+d/600)){
    foes.push({type:'crow',x:lastAX+gap/2,y:rand(200,360),by:0,ph:Math.random()*6,vx:-rand(30,70)});
    foes[foes.length-1].by=foes[foes.length-1].y;
  }
  lastAX+=gap;
  anchors.push({x:lastAX,y:rand(60,240)});
}
function fill(){
  while(lastIX<cam+W+600) addIsland();
  while(lastAX<cam+W+600) addAnchor();
}

function pickTarget(){
  const aim={x:p.x+170,y:p.y-210};
  let bestA=null,bs=1e9;
  for(const a of anchors){
    if(a.x<p.x-30||a.y>p.y-40) continue;
    if(Math.hypot(a.x-p.x,a.y-p.y)>RANGE) continue;
    const s=Math.hypot(a.x-aim.x,a.y-aim.y);
    if(s<bs){bs=s;bestA=a}
  }
  return bestA;
}
function tryHook(){
  const a=pickTarget();
  if(a) hook={a,L:Math.max(70,Math.hypot(a.x-p.x,a.y-p.y-30)),shoot:0};
}
function press(){
  if(held) return; held=true;
  if(state==='over'){ reset(); }
  if(state==='ready'){ state='play'; panel.hidden=true; resultEl.hidden=true; }
  if(state!=='play') return;
  if(onGround){ onGround=false; v.y=-600; v.x=Math.max(v.x,RUN); }
  tryHook();
}
function release(){ held=false; hook=null; }

const wrap=document.getElementById('wrap');
wrap.addEventListener('pointerdown',e=>{e.preventDefault();press()});
addEventListener('pointerup',release); addEventListener('pointercancel',release);
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)press()}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')release()});

function islandAt(x){return islands.find(s=>x>=s.x0-4&&x<=s.x1+4)}
function burst(x,y,col,n=10){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rand(80,260);fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:.6,col})}}
function popup(x,y,text){fx.push({x,y,vx:0,vy:-60,life:.9,text})}

function die(msg,water){
  if(state!=='play') return;
  deathMsg=msg; hook=null;
  if(water){ splash={x:p.x,t:0}; finish(); }
  else { state='dying'; dieT=0; v.x=-160; v.y=-480; burst(p.x,p.y-22,'ink',8); }
}
function finish(){
  state='over';
  const sc=score();
  const isBest=sc>best&&sc>0;
  if(isBest){best=sc; try{localStorage.setItem('kaginawa-best2',best)}catch(e){}}
  bestEl.textContent=`最高 ${best} 点`;
  resultEl.innerHTML=`${sc} 点${isBest?' ― 新記録':''}<small>${deathMsg} ・ ${meters} m ・ 討伐 ${kills}</small>`;
  resultEl.hidden=false; goEl.textContent='タップでもう一度'; panel.hidden=false;
}
const score=()=>meters+kills*10;

function step(dt){
  t+=dt;
  for(const f of fx){f.x+=f.vx*dt; f.vy+=(f.text?0:900)*dt; f.y+=f.vy*dt; f.life-=dt}
  fx=fx.filter(f=>f.life>0);
  if(splash) splash.t+=dt;
  if(state==='dying'){
    v.y+=G*dt; p.x+=v.x*dt; p.y+=v.y*dt; spin+=dt*9; dieT+=dt;
    if(p.y>WATER){ splash={x:p.x,t:0}; finish(); }
    return;
  }
  if(state==='ready'){ for(const f of foes) moveFoe(f,dt); return; }
  if(state!=='play') return;

  if(held&&!hook&&!onGround) tryHook();
  const px=p.x, py=p.y;

  if(onGround){
    const s=islandAt(p.x);
    if(!s){ onGround=false; }
    else { v.x+=(RUN-v.x)*Math.min(1,5*dt); v.y=0; p.y=s.top-8; p.x+=v.x*dt; }
  }
  if(!onGround){
    v.y+=G*dt;
    if(hook){
      hook.shoot=Math.min(1,hook.shoot+dt*12);
      const dx=p.x-hook.a.x, dy=p.y-hook.a.y, d=Math.hypot(dx,dy), tx=-dy/d, ty=dx/d, vt=v.x*tx+v.y*ty;
      const pump=180*Math.sign(vt||1); v.x+=tx*pump*dt; v.y+=ty*pump*dt;
    }
    v.x*=1-0.15*dt; v.y*=1-0.05*dt;
    p.x+=v.x*dt; p.y+=v.y*dt;
    if(hook){
      const dx=p.x-hook.a.x, dy=p.y-hook.a.y, d=Math.hypot(dx,dy);
      if(d>hook.L){
        const nx=dx/d, ny=dy/d;
        p.x=hook.a.x+nx*hook.L; p.y=hook.a.y+ny*hook.L;
        const vr=v.x*nx+v.y*ny; if(vr>0){v.x-=vr*nx; v.y-=vr*ny}
      }
      hook.L=Math.max(70,hook.L-30*dt);
    }
    if(p.y<30){p.y=30; if(v.y<0)v.y*=-.3}
    // ground collision
    for(const s of islands){
      if(p.x<s.x0-4||p.x>s.x1+4) continue;
      const feet=p.y+8, prev=py+8;
      if(prev<=s.top+2 && feet>=s.top && v.y>=0){
        p.y=s.top-8; v.y=0; onGround=true; hook=null; v.x=Math.max(v.x,120); break;
      } else if(feet>s.top+2){
        if(px<s.x0){ p.x=s.x0-7; v.x=Math.min(v.x,-40); }
        else if(px>s.x1){ p.x=s.x1+7; v.x=Math.max(v.x,40); }
      }
    }
  }
  trail.push({x:p.x,y:p.y}); if(trail.length>18) trail.shift();

  // foes
  const bx=p.x, by=p.y-22;
  for(const f of foes){
    moveFoe(f,dt);
    if(f.dead) continue;
    const fy=f.type==='crow'?f.y:f.y-18, r=f.type==='crow'?16:15;
    if(Math.abs(f.x-bx)<r+12 && Math.abs(fy-by)<r+20){
      const stomp = !onGround && v.y>40 && p.y+8 < fy+6;
      if(stomp){
        f.dead=true; kills++; v.y=-560; hook=null;
        burst(f.x,fy,'foe',12); popup(f.x,fy-26,'+10');
      } else {
        die(f.type==='crow'?'烏に当たった':f.type==='archer'?'弓兵に当たった':'足軽に当たった');
        return;
      }
    }
  }
  foes=foes.filter(f=>!f.dead&&f.x>cam-200);
  for(const a of arrows){
    a.vy+=300*dt; a.x+=a.vx*dt; a.y+=a.vy*dt;
    if(Math.abs(a.x-bx)<12&&Math.abs(a.y-by)<26){ die('矢に当たった'); return; }
    const s=islandAt(a.x); if(s&&a.y>s.top) a.gone=true;
  }
  arrows=arrows.filter(a=>!a.gone&&a.x>cam-100&&a.y<WATER);

  anchors=anchors.filter(a=>a.x>cam-100);
  islands=islands.filter(s=>s.x1>cam-200);
  fill();
  meters=Math.max(meters,Math.floor((p.x-90)/PX_PER_M));
  scoreEl.innerHTML=`${score()}<small>点</small>`;
  subEl.innerHTML=`${meters} m ・ 討伐 <b>${kills}</b>`;
  if(p.y>WATER) die('川に落ちた',true);
}
function moveFoe(f,dt){
  f.ph+=dt;
  if(f.type==='walker'){ f.x+=f.vx*dt; if(f.x<f.min){f.x=f.min;f.vx*=-1} if(f.x>f.max){f.x=f.max;f.vx*=-1} }
  else if(f.type==='crow'){ f.x+=f.vx*dt; f.y=f.by+Math.sin(f.ph*2.2)*36; }
  else if(f.type==='archer' && state==='play'){
    const dx=f.x-p.x;
    f.draw=Math.max(0,f.draw-dt*3);
    if(dx>60 && dx<W*.9){
      f.cool-=dt;
      if(f.cool<.35) f.draw=Math.min(1,f.draw+dt*6);
      if(f.cool<=0){
        f.cool=rand(1.6,2.4);
        const sx=f.x-10, sy=f.y-30, tx=p.x+v.x*.35, ty=p.y-22;
        const ang=Math.atan2(ty-sy,tx-sx), sp=430;
        arrows.push({x:sx,y:sy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-60});
      }
    }
  }
}

// --- drawing ---
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C={skyT:css('--sky-top'),skyB:css('--sky-bot'),ink:css('--ink'),soft:css('--ink-soft'),brass:css('--brass'),ai:css('--ai'),water:css('--water'),foe:css('--foe')};
function ridge(par,base,amp,freq,seed){
  ctx.beginPath(); ctx.moveTo(0,H);
  const off=cam*par;
  for(let x=0;x<=W+20;x+=16){
    const wx=x+off;
    ctx.lineTo(x,base-amp*(Math.sin(wx*freq+seed)*.6+Math.sin(wx*freq*2.3+seed*2)*.3+Math.sin(wx*freq*5.1)*.1));
  }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
}
function draw(){
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,C.skyT); g.addColorStop(1,C.skyB);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(W*.78,110,46,0,7); ctx.fill();
  ctx.fillStyle=C.ink;
  ctx.globalAlpha=.14; ridge(.08,400,90,.004,1);
  ctx.globalAlpha=.24; ridge(.2,450,60,.007,3);
  ctx.globalAlpha=1;
  ctx.fillStyle=C.water; ctx.fillRect(0,WATER,W,H-WATER);
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.5;
  for(let i=0;i<3;i++){ctx.beginPath();
    for(let x=0;x<=W;x+=12){const y=WATER+8+i*12+Math.sin((x+cam*.9)*.05+t*2+i)*2; x?ctx.lineTo(x,y):ctx.moveTo(x,y)} ctx.stroke()}

  ctx.save(); ctx.translate(-cam,0);
  // islands
  for(const s of islands){
    if(s.x1<cam-20||s.x0>cam+W+20) continue;
    ctx.fillStyle=C.ink;
    ctx.beginPath(); ctx.moveTo(s.x0,s.top); ctx.lineTo(s.x1,s.top);
    ctx.lineTo(s.x1-8,s.top+30); ctx.lineTo(s.x1-2,WATER+20); ctx.lineTo(s.x0+2,WATER+20); ctx.lineTo(s.x0+8,s.top+30); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=C.soft; ctx.lineWidth=1.2;
    for(let x=s.x0+10;x<s.x1-6;x+=23){const h=4+((x*7)%5); ctx.beginPath(); ctx.moveTo(x,s.top); ctx.lineTo(x-2,s.top-h); ctx.moveTo(x+3,s.top); ctx.lineTo(x+5,s.top-h+1); ctx.stroke()}
  }
  // anchors
  const tgt=state==='play'&&!hook&&!onGround?pickTarget():null;
  for(const a of anchors){
    ctx.strokeStyle=C.soft; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(a.x,0); ctx.lineTo(a.x,a.y-9); ctx.stroke();
    const on=(hook&&hook.a===a)||a===tgt;
    ctx.strokeStyle=on?C.brass:C.ink; ctx.lineWidth=on?4:3;
    ctx.beginPath(); ctx.arc(a.x,a.y,9,0,7); ctx.stroke();
    if(a===tgt){ctx.globalAlpha=.35+.25*Math.sin(t*8); ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(a.x,a.y,17,0,7); ctx.stroke(); ctx.globalAlpha=1}
  }
  for(const f of foes) drawFoe(f);
  // arrows
  ctx.strokeStyle=C.foe; ctx.lineWidth=2;
  for(const a of arrows){const an=Math.atan2(a.vy,a.vx); ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(an);
    ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(8,0); ctx.moveTo(8,0); ctx.lineTo(3,-3); ctx.moveTo(8,0); ctx.lineTo(3,3);
    ctx.moveTo(-16,0); ctx.lineTo(-19,-3); ctx.moveTo(-16,0); ctx.lineTo(-19,3); ctx.stroke(); ctx.restore()}
  if(state==='play'&&!hook&&!onGround){ctx.strokeStyle='rgba(29,34,40,.16)'; ctx.lineWidth=2; ctx.beginPath(); trail.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)); ctx.stroke()}
  if(hook){
    const hx=p.x,hy=p.y-30,k=hook.shoot, ex=hx+(hook.a.x-hx)*k, ey=hy+(hook.a.y-hy)*k;
    ctx.strokeStyle=C.ai; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.fillStyle=C.brass; ctx.beginPath(); ctx.arc(ex,ey,4,0,7); ctx.fill();
  }
  if(!(state==='over'&&splash)) drawMan();
  if(splash&&splash.t<1.2){ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2; const r=splash.t*80;
    for(const s of[1,.6]){ctx.beginPath(); ctx.ellipse(splash.x,WATER+4,r*s,r*s*.25,0,0,7); ctx.stroke()}}
  for(const f of fx){
    ctx.globalAlpha=Math.min(1,f.life*2);
    if(f.text){ctx.fillStyle=C.brass; ctx.font=`700 16px ${css('--ui')}`; ctx.textAlign='center'; ctx.fillText(f.text,f.x,f.y)}
    else{ctx.fillStyle=f.col==='foe'?C.foe:C.ink; ctx.fillRect(f.x-2,f.y-2,4,4)}
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function stick(x,y,col,run,dir=1){
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(x,y-38,7,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x,y-31); ctx.lineTo(x,y-12);
  const s=Math.sin(run)*6;
  ctx.moveTo(x,y-12); ctx.lineTo(x-s,y); ctx.moveTo(x,y-12); ctx.lineTo(x+s,y); ctx.stroke();
}
function drawFoe(f){
  if(f.type==='walker'){
    stick(f.x,f.y,C.foe,f.ph*9);
    const d=Math.sign(f.vx);
    ctx.beginPath(); ctx.moveTo(f.x,f.y-26); ctx.lineTo(f.x+d*10,f.y-20); ctx.lineTo(f.x+d*24,f.y-34); ctx.stroke(); // spear arm
    ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(f.x+d*2,f.y-18); ctx.lineTo(f.x+d*30,f.y-40); ctx.stroke();
    // jingasa hat
    ctx.beginPath(); ctx.moveTo(f.x-11,f.y-41); ctx.lineTo(f.x,f.y-50); ctx.lineTo(f.x+11,f.y-41); ctx.closePath(); ctx.fill();
  } else if(f.type==='archer'){
    stick(f.x,f.y,C.foe,0);
    ctx.lineWidth=2.5; const pull=f.draw*8;
    ctx.beginPath(); ctx.moveTo(f.x,f.y-26); ctx.lineTo(f.x-12,f.y-28); ctx.moveTo(f.x,f.y-26); ctx.lineTo(f.x-2+pull,f.y-28); ctx.stroke();
    ctx.lineWidth=2; ctx.beginPath(); ctx.arc(f.x-6,f.y-28,16,Math.PI*.62,Math.PI*1.38); ctx.stroke();
    ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(f.x-6+16*Math.cos(Math.PI*.62),f.y-28+16*Math.sin(Math.PI*.62)); ctx.lineTo(f.x-2+pull,f.y-28);
    ctx.lineTo(f.x-6+16*Math.cos(Math.PI*1.38),f.y-28+16*Math.sin(Math.PI*1.38)); ctx.stroke();
    ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(f.x-11,f.y-41); ctx.lineTo(f.x,f.y-50); ctx.lineTo(f.x+11,f.y-41); ctx.closePath(); ctx.fill();
  } else {
    const w=Math.sin(f.ph*14)*8;
    ctx.fillStyle=C.ink; ctx.strokeStyle=C.ink; ctx.lineWidth=3; ctx.lineJoin='round';
    ctx.beginPath(); ctx.ellipse(f.x,f.y,11,6,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(f.x-14,f.y-1); ctx.lineTo(f.x-20,f.y-2); ctx.lineTo(f.x-14,f.y+3); ctx.fill(); // beak (faces left)
    ctx.beginPath(); ctx.moveTo(f.x-4,f.y); ctx.lineTo(f.x+4,f.y-10-w); ctx.lineTo(f.x+18,f.y-4-w*.5); ctx.stroke();
    ctx.fillStyle=C.foe; ctx.beginPath(); ctx.arc(f.x-8,f.y-2,2,0,7); ctx.fill();
  }
}
function drawMan(){
  const x=p.x,y=p.y; ctx.strokeStyle=C.ink; ctx.fillStyle=C.ink; ctx.lineWidth=3.2; ctx.lineCap='round'; ctx.lineJoin='round';
  let lean=0;
  if(state==='dying') lean=spin;
  else if(hook) lean=Math.atan2(hook.a.x-x,-(hook.a.y-y))*.6;
  else if(onGround&&state==='play') lean=.15;
  else if(state==='play') lean=Math.max(-.6,Math.min(.6,v.x/900));
  ctx.save(); ctx.translate(x,y-22); ctx.rotate(lean); ctx.translate(0,22);
  ctx.beginPath(); ctx.arc(0,-46,7.5,0,7); ctx.fill();
  ctx.strokeStyle=C.ai; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(-3,-40);
  const fl=state==='play'?Math.sin(t*18)*3:0; ctx.quadraticCurveTo(-14,-42+fl,-24,-38-fl); ctx.stroke();
  ctx.strokeStyle=C.ink; ctx.lineWidth=3.2;
  ctx.beginPath(); ctx.moveTo(0,-38); ctx.lineTo(0,-14); ctx.stroke();
  ctx.beginPath();
  if(hook){ctx.moveTo(0,-34); ctx.lineTo(-3,-46); ctx.moveTo(0,-34); ctx.lineTo(4,-47);}
  else if(state==='ready'){ctx.moveTo(0,-32); ctx.lineTo(-8,-20); ctx.moveTo(0,-32); ctx.lineTo(8,-20);}
  else if(onGround){const s=Math.sin(t*16)*9; ctx.moveTo(0,-32); ctx.lineTo(s,-22); ctx.moveTo(0,-32); ctx.lineTo(-s,-22);}
  else {const s=Math.sin(t*10)*.5; ctx.moveTo(0,-32); ctx.lineTo(-11,-38+s*6); ctx.moveTo(0,-32); ctx.lineTo(11,-40-s*6);}
  ctx.stroke();
  ctx.beginPath();
  if(state==='ready'){ctx.moveTo(0,-14); ctx.lineTo(-6,8); ctx.moveTo(0,-14); ctx.lineTo(6,8);}
  else if(onGround){const s=Math.sin(t*16); ctx.moveTo(0,-14); ctx.lineTo(s*7,-3); ctx.lineTo(s*12,8); ctx.moveTo(0,-14); ctx.lineTo(-s*7,-3); ctx.lineTo(-s*12-2,8);}
  else{const s=hook?Math.sin(t*4)*.3:Math.sin(t*14); ctx.moveTo(0,-14); ctx.lineTo(-7+s*4,-2); ctx.lineTo(-5+s*6,8);
    ctx.moveTo(0,-14); ctx.lineTo(8-s*4,-4); ctx.lineTo(6-s*6,6);}
  ctx.stroke(); ctx.restore();
}

reset();
let last=performance.now(), acc=0;
function loop(now){
  acc+=Math.min(.05,(now-last)/1000); last=now;
  while(acc>=1/120){step(1/120); acc-=1/120}
  if(state==='play'){ const target=Math.max(0,p.x-W*.35); cam+=(target-cam)*.12; }
  else if(state==='ready') cam=0;
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
